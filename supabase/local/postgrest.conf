# Local stand-in for Supabase's REST API. Pair with .env.local:
#   NEXT_PUBLIC_SUPABASE_URL=http://localhost:3001
#   SUPABASE_SECRET_KEY=<JWT {"role":"service_role"} signed with jwt-secret below>
db-uri = "postgres://authenticator@localhost:5432/wbs_calendar"
db-schemas = "public"
server-port = 3001
jwt-secret = "local-dev-only-jwt-secret-not-for-production"
